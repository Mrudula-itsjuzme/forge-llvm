name: CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM toolchain
        run: sudo apt-get update && sudo apt-get install -y llvm-18-dev llvm-18-tools clang-18 ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DLLVM_DIR=$(/usr/lib/llvm-18/bin/llvm-config --cmakedir) -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
